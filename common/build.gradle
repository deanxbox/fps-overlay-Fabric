plugins {
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // YACL API is referenced by common config screen code; each platform supplies its runtime variant.
    compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"
}

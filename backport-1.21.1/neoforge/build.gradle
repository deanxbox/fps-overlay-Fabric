plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.neoforged.net/releases/" }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-neoforge-1.21.1"
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // YACL (NeoForge)
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "mod_id": project.mod_id,
               "mod_name": project.mod_name,
               "mod_description": project.mod_description,
               "mod_author": project.mod_author,
               "mod_license": project.mod_license,
               "neoforge_version": project.neoforge_version,
               "mod_homepage": project.mod_homepage,
               "mod_sources": project.mod_sources
    }
}

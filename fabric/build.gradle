plugins {
    id 'net.fabricmc.fabric-loom'
    id 'com.modrinth.minotaur'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // YACL (Fabric)
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"

    // Mod Menu (Fabric only, optional at runtime)
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

    // Common module
    implementation project(':common')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "mod_id": project.mod_id,
               "mod_name": project.mod_name,
               "mod_description": project.mod_description,
               "mod_author": project.mod_author,
               "mod_license": project.mod_license,
               "minecraft_version": project.minecraft_version,
               "fabric_loader_version": project.fabric_loader_version,
               "mod_homepage": project.mod_homepage,
               "mod_sources": project.mod_sources
    }
}

jar {
    dependsOn project(':common').tasks.named('classes')
    from(project(':common').sourceSets.main.output)
}

sourcesJar {
    dependsOn project(':common').tasks.named('sourcesJar')
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ─── Publishing ───

def changelogContent = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : "No changelog provided."
def hasCurseforgeToken = (System.getenv("CURSEFORGE_TOKEN") ?: project.findProperty("curseforge_token")) as boolean

if (hasCurseforgeToken) {
    apply plugin: 'net.darkhax.curseforgegradle'
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: project.findProperty("modrinth_token") ?: ""
    projectId = project.modrinth_project_id
    versionNumber = "${project.mod_version}+fabric"
    versionName = "v5.1 (Fabric)"
    versionType = "release"
    uploadFile = jar
    changelog = changelogContent
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "yacl"
        optional.project "modmenu"
    }
}

def curseforgeId = project.findProperty('curseforge_project_id') ?: ''
if (hasCurseforgeToken && curseforgeId) {
    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        apiToken = System.getenv("CURSEFORGE_TOKEN") ?: project.findProperty("curseforge_token") ?: ""

        def mainFile = upload(curseforgeId, jar)
        mainFile.releaseType = 'release'
        mainFile.addGameVersion(project.minecraft_version, "Fabric", "Java 25")
        mainFile.changelog = changelogContent
        mainFile.changelogType = 'markdown'

        mainFile.addRequirement('fabric-api', 'yacl')
        mainFile.addOptional('modmenu')

        dependsOn(jar)
    }
}

tasks.named("modrinth").configure { dependsOn(jar) }
